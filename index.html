<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oppskriftboken min</title>
  <style>
    body { font-family: Georgia, serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { border-bottom: 2px solid #c0392b; padding-bottom: .3rem; }
    .oppskrift { margin: 2rem 0; }
  </style>
</head>
<body>
  <h1>Oppskriftboken min</h1>

  <div class="oppskrift">
    <h2>Pannekaker</h2>
    <h3>Ingredienser</h3>
    <ul>
      <li>3 egg</li>
      <li>5 dl melk</li>
      <li>250 g mel</li>
    </ul>
    <h3>Fremgangsmåte</h3>
    <ol>
      <li>Visp sammen alt til en jevn røre.</li>
      <li>Stek tynne pannekaker i smør.</li>
    </ol>
  </div>
</body>
</html>
